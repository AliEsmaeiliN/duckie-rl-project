name: duckie-matrix
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - libjpeg-turbo
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch            # CPU build: the actor is tiny, inference is <1 ms on CPU
      - duckietown-sdk==0.2.0
      - dtps-http==1.6.1   
      - numpy<2
      - opencv-python==4.11.0.86
      - pyyaml
      - tyro
      - matplotlib
